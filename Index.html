<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어 암기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
            --pink:#FF6B81; --pink-light:#FFB3BC; --pink-pale:#FFF0F2; --pink-bg:#FFF5F6;
            --blue:#5B8DEF; --blue-light:#D6E4FF;
            --green:#2ECC94; --green-light:#D4F5E9;
            --yellow:#F9C846; --yellow-light:#FFF8DC;
            --gray:#8E9BAE; --gray-light:#F4F6F9; --gray-border:#E8ECF0;
            --text-main:#1A1D23; --text-sub:#6B7685; --white:#FFFFFF;
            --radius-lg:20px; --radius-md:14px; --radius-sm:8px;
            --shadow:0 4px 24px rgba(0,0,0,0.08); --shadow-lg:0 8px 40px rgba(0,0,0,0.12);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-main);background:linear-gradient(145deg,#FFE8EC 0%,#FFF0E6 50%,#E8F0FF 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
        .container{background:var(--white);border-radius:var(--radius-lg);padding:28px 24px 32px;width:92%;max-width:860px;box-shadow:var(--shadow-lg);min-height:600px;}
        .page{display:none;} .page.active{display:block;}

        /* 메인 */
        .main-header{text-align:center;margin-bottom:24px;}
        .main-logo{font-size:2.6em;margin-bottom:4px;}
        .main-title{font-size:1.55em;font-weight:700;color:var(--text-main);letter-spacing:-0.5px;margin-bottom:4px;}
        .main-subtitle{font-size:0.82em;color:var(--gray);font-weight:400;}
        .stat-bar{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;}
        .stat-chip{display:flex;align-items:center;gap:6px;background:var(--gray-light);border-radius:50px;padding:8px 16px;font-size:0.82em;font-weight:600;color:var(--text-sub);}
        .stat-chip .stat-num{font-size:1.05em;font-weight:700;color:var(--pink);}
        .stat-chip.no-data{color:var(--gray);font-weight:400;}
        .level-label{text-align:center;font-size:0.78em;font-weight:500;color:var(--gray);margin-bottom:10px;letter-spacing:0.5px;}
        .level-selector{display:flex;justify-content:center;gap:8px;margin-bottom:26px;flex-wrap:wrap;}
        .level-btn{padding:8px 20px;border:2px solid var(--gray-border);background:var(--white);border-radius:50px;cursor:pointer;font-size:0.88em;font-weight:600;color:var(--text-sub);transition:all 0.2s;font-family:var(--font-main);}
        .level-btn.active,.level-btn:hover{background:var(--pink);border-color:var(--pink);color:var(--white);box-shadow:0 3px 10px rgba(255,107,129,0.3);}
        .main-buttons{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:0 auto;}
        .main-btn{padding:17px 24px;border:none;border-radius:var(--radius-md);font-size:1em;font-weight:700;cursor:pointer;transition:all 0.22s;font-family:var(--font-main);display:flex;align-items:center;gap:10px;justify-content:center;letter-spacing:-0.2px;}
        .btn-start{background:linear-gradient(135deg,#FF6B81,#FF4F7B);color:var(--white);box-shadow:0 4px 16px rgba(255,107,129,0.35);}
        .btn-manage{background:linear-gradient(135deg,#5B8DEF,#3D6FD9);color:var(--white);box-shadow:0 4px 16px rgba(91,141,239,0.3);}
        .btn-record{background:linear-gradient(135deg,#2ECC94,#1FAF7A);color:var(--white);box-shadow:0 4px 16px rgba(46,204,148,0.3);}
        .main-btn:hover{transform:translateY(-3px);filter:brightness(1.06);}

        /* 공통 헤더 */
        .page-header{display:flex;align-items:center;margin-bottom:22px;gap:12px;}
        .back-btn{background:var(--gray-light);color:var(--text-sub);border:none;border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;font-size:0.82em;font-weight:600;font-family:var(--font-main);transition:all 0.18s;white-space:nowrap;}
        .back-btn:hover{background:var(--gray-border);color:var(--text-main);}
        .page-title{font-size:1.2em;font-weight:700;color:var(--text-main);letter-spacing:-0.3px;}

        /* 시험 */
        .algo-info{background:var(--blue-light);border-radius:var(--radius-sm);padding:10px 14px;font-size:0.79em;color:var(--blue);font-weight:500;margin-bottom:18px;line-height:1.5;}
        .progress-bar-container{background:var(--gray-light);border-radius:50px;height:8px;margin-bottom:8px;overflow:hidden;}
        .progress-bar{background:linear-gradient(90deg,var(--pink),#FF4F7B);height:100%;border-radius:50px;transition:width 0.35s ease;}
        .progress-text{text-align:center;color:var(--gray);font-size:0.8em;font-weight:500;margin-bottom:22px;}
        .word-card{background:linear-gradient(145deg,var(--pink-pale),#FFF0E8);border-radius:var(--radius-lg);padding:48px 28px;text-align:center;margin-bottom:24px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,107,129,0.12);}
        .word-japanese{font-size:2.6em;color:var(--text-main);font-weight:700;margin-bottom:8px;letter-spacing:2px;font-family:'Noto Sans KR',sans-serif;}
        .word-hiragana{font-size:1.1em;color:var(--text-sub);margin-bottom:14px;font-family:'Noto Sans KR',sans-serif;}
        .word-korean{font-size:1.35em;color:var(--pink);font-weight:700;display:none;}
        .exam-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .show-meaning-btn{background:linear-gradient(135deg,var(--blue),#3D6FD9);color:var(--white);border:none;border-radius:var(--radius-md);padding:14px 38px;font-size:0.95em;font-weight:700;cursor:pointer;font-family:var(--font-main);transition:all 0.2s;box-shadow:0 3px 12px rgba(91,141,239,0.3);}
        .answer-buttons{display:none;gap:12px;}
        .correct-btn{background:linear-gradient(135deg,var(--green),#1FAF7A);color:var(--white);border:none;border-radius:var(--radius-md);padding:14px 36px;font-size:1.25em;font-weight:700;cursor:pointer;font-family:var(--font-main);transition:all 0.2s;box-shadow:0 3px 12px rgba(46,204,148,0.3);}
        .wrong-btn{background:linear-gradient(135deg,var(--pink),#FF4F7B);color:var(--white);border:none;border-radius:var(--radius-md);padding:14px 36px;font-size:1.25em;font-weight:700;cursor:pointer;font-family:var(--font-main);transition:all 0.2s;box-shadow:0 3px 12px rgba(255,107,129,0.3);}
        .correct-btn:hover,.wrong-btn:hover,.show-meaning-btn:hover{transform:translateY(-2px);filter:brightness(1.08);}

        /* 결과 */
        .result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
        .result-score{background:linear-gradient(135deg,var(--pink),#FF4F7B);color:var(--white);padding:8px 20px;border-radius:50px;font-weight:700;font-size:1em;}
        .result-table{width:100%;border-collapse:collapse;font-size:0.88em;}
        .result-table th{background:var(--pink-pale);color:var(--pink);padding:11px 10px;text-align:center;font-weight:700;border-bottom:2px solid var(--pink-light);}
        .result-table td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--gray-border);color:var(--text-main);}
        .result-table tr:nth-child(even){background:var(--gray-light);}
        .result-correct{color:var(--green);font-weight:700;font-size:1.15em;}
        .result-wrong{color:var(--pink);font-weight:700;font-size:1.15em;}

        /* 단어 목록 컨트롤 */
        .manage-controls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
        .add-word-btn{background:linear-gradient(135deg,var(--green),#1FAF7A);color:var(--white);border:none;border-radius:50px;padding:8px 16px;font-size:0.82em;font-weight:700;cursor:pointer;font-family:var(--font-main);white-space:nowrap;box-shadow:0 2px 8px rgba(46,204,148,0.25);}
        .add-word-btn:hover{filter:brightness(1.08);}
        .search-input{padding:8px 14px;border:1.5px solid var(--gray-border);border-radius:50px;font-size:0.84em;font-family:var(--font-main);outline:none;width:160px;color:var(--text-main);background:var(--gray-light);transition:border-color 0.18s;}
        .search-input:focus{border-color:var(--pink);background:var(--white);}
        .sort-btn{padding:7px 14px;border:1.5px solid var(--blue-light);background:var(--white);border-radius:50px;cursor:pointer;font-size:0.8em;font-weight:600;color:var(--blue);font-family:var(--font-main);transition:all 0.18s;white-space:nowrap;display:flex;align-items:center;gap:4px;}
        .sort-btn:hover{background:var(--blue-light);}
        .sort-btn.sort-asc{background:var(--blue);color:var(--white);border-color:var(--blue);}
        .sort-btn.sort-desc{background:#3D6FD9;color:var(--white);border-color:#3D6FD9;}
        .filter-level{display:flex;gap:6px;flex-wrap:wrap;}
        .filter-btn{padding:5px 14px;border:1.5px solid var(--gray-border);background:var(--white);border-radius:50px;cursor:pointer;font-size:0.78em;font-weight:600;color:var(--text-sub);font-family:var(--font-main);transition:all 0.18s;}
        .filter-btn.active{background:var(--pink);border-color:var(--pink);color:var(--white);}
        .filter-btn:hover:not(.active){border-color:var(--pink-light);color:var(--pink);}

        /* 단어 테이블 */
        .word-table-wrap{height:420px;overflow-y:auto;border:1.5px solid var(--gray-border);border-radius:var(--radius-md);position:relative;background:var(--white);}
        .word-table-wrap::-webkit-scrollbar{width:6px;}
        .word-table-wrap::-webkit-scrollbar-track{background:var(--gray-light);}
        .word-table-wrap::-webkit-scrollbar-thumb{background:var(--pink-light);border-radius:3px;}
        .word-table{width:100%;border-collapse:collapse;font-size:0.865em;}
        .word-table thead{position:sticky;top:0;z-index:2;}
        .word-table th{background:var(--pink-pale);color:var(--pink);padding:11px 10px;text-align:center;font-weight:700;border-bottom:2px solid var(--pink-light);white-space:nowrap;font-size:0.88em;}
        .word-table td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--gray-border);vertical-align:middle;color:var(--text-main);}
        .word-table tbody tr:nth-child(even){background:var(--gray-light);}
        .word-table tbody tr:hover{background:var(--pink-pale);}
        .td-kanji{font-weight:700;font-family:'Noto Sans KR',sans-serif;}
        .td-hira{color:var(--text-sub);font-size:0.9em;font-family:'Noto Sans KR',sans-serif;}
        .td-mean{color:var(--text-main);font-size:0.9em;text-align:left;padding-left:14px;}
        .word-level-tag{background:var(--pink-pale);color:var(--pink);padding:2px 8px;border-radius:50px;font-size:0.75em;font-weight:700;}
        .word-rate-tag{padding:2px 9px;border-radius:50px;font-size:0.75em;font-weight:700;white-space:nowrap;}
        .rate-none{background:var(--gray-light);color:var(--gray);}
        .rate-low{background:#FFE5E8;color:#D93254;}
        .rate-mid{background:var(--yellow-light);color:#B5860A;}
        .rate-high{background:var(--green-light);color:#1A8A5A;}
        .delete-btn{background:#FFE5E8;color:#D93254;border:none;border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;font-size:0.75em;font-weight:600;font-family:var(--font-main);transition:all 0.18s;}
        .delete-btn:hover{background:var(--pink);color:var(--white);}
        #scrollSentinel{height:1px;}
        .loading-row td{text-align:center;padding:14px;color:var(--pink-light);font-size:0.82em;letter-spacing:2px;}
        /* ★ 하단 스크롤 상태 텍스트 */
        .scroll-status{text-align:center;font-size:0.75em;color:var(--gray);margin-top:7px;min-height:18px;font-weight:500;}

        /* 모달 */
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(20,24,32,0.45);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
        .modal-overlay.active{display:flex;}
        .modal{background:var(--white);border-radius:var(--radius-lg);padding:28px 24px;width:92%;max-width:400px;box-shadow:var(--shadow-lg);}
        .modal h3{color:var(--text-main);margin-bottom:18px;font-size:1.1em;font-weight:700;}
        .modal-input{width:100%;padding:11px 14px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);font-size:0.92em;margin-bottom:10px;font-family:var(--font-main);outline:none;color:var(--text-main);background:var(--gray-light);transition:all 0.18s;}
        .modal-input:focus{border-color:var(--pink);background:var(--white);}
        .modal-select{width:100%;padding:11px 14px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);font-size:0.92em;margin-bottom:16px;font-family:var(--font-main);outline:none;background:var(--gray-light);color:var(--text-main);}
        .modal-buttons{display:flex;gap:8px;justify-content:flex-end;}
        .modal-cancel{background:var(--gray-light);color:var(--text-sub);border:none;border-radius:var(--radius-sm);padding:10px 18px;cursor:pointer;font-family:var(--font-main);font-weight:600;font-size:0.88em;}
        .modal-confirm{background:linear-gradient(135deg,var(--pink),#FF4F7B);color:var(--white);border:none;border-radius:var(--radius-sm);padding:10px 18px;cursor:pointer;font-weight:700;font-family:var(--font-main);font-size:0.88em;}

        /* 정오표 모달 */
        .detail-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(20,24,32,0.5);z-index:1100;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
        .detail-modal-overlay.active{display:flex;}
        .detail-modal{background:var(--white);border-radius:var(--radius-lg);padding:26px 22px;width:94%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
        .detail-modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
        .detail-modal-title{color:var(--text-main);font-size:1.05em;font-weight:700;}
        .detail-modal-meta{font-size:0.78em;color:var(--gray);margin-top:3px;}
        .detail-modal-close{background:var(--gray-light);color:var(--text-sub);border:none;border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-size:0.82em;font-weight:600;white-space:nowrap;font-family:var(--font-main);}
        .detail-modal-score{display:inline-block;background:linear-gradient(135deg,var(--pink),#FF4F7B);color:var(--white);padding:5px 16px;border-radius:50px;font-weight:700;font-size:0.92em;margin-bottom:14px;}
        .detail-modal-body{overflow-y:auto;flex:1;}
        .detail-table{width:100%;border-collapse:collapse;font-size:0.87em;}
        .detail-table th{background:var(--pink-pale);color:var(--pink);padding:10px;text-align:center;font-weight:700;position:sticky;top:0;border-bottom:1.5px solid var(--pink-light);}
        .detail-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--gray-border);}
        .detail-table tr:nth-child(even){background:var(--gray-light);}

        /* 시험 기록 */
        .record-list{max-height:490px;overflow-y:auto;}
        .record-list::-webkit-scrollbar{width:5px;}
        .record-list::-webkit-scrollbar-thumb{background:var(--pink-light);border-radius:3px;}
        .record-item{display:flex;align-items:center;padding:14px 16px;border-radius:var(--radius-md);margin-bottom:6px;cursor:pointer;transition:all 0.18s;border:1.5px solid var(--gray-border);gap:14px;background:var(--white);}
        .record-item:hover{border-color:var(--pink-light);background:var(--pink-pale);}
        .record-item-left{flex:1;}
        .record-item-date{font-size:0.78em;color:var(--gray);margin-bottom:4px;font-weight:500;}
        .record-item-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .record-item-level{background:var(--pink-pale);color:var(--pink);padding:2px 8px;border-radius:50px;font-size:0.75em;font-weight:700;}
        .record-item-title{font-size:0.9em;color:var(--text-main);font-weight:600;}
        .record-item-right{text-align:right;}
        .record-score-badge{display:inline-block;padding:4px 14px;border-radius:50px;font-weight:700;font-size:0.88em;white-space:nowrap;}
        .score-great{background:var(--green-light);color:#1A8A5A;}
        .score-good{background:var(--yellow-light);color:#B5860A;}
        .score-poor{background:#FFE5E8;color:#D93254;}
        .record-score-detail{font-size:0.75em;color:var(--gray);margin-top:3px;font-weight:500;}
        .record-arrow{color:var(--pink-light);font-size:1.1em;}
        .no-record-msg{text-align:center;color:var(--gray);padding:60px 20px;font-size:0.92em;line-height:2;}
        .record-page-summary{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
        .summary-chip{background:var(--gray-light);color:var(--text-sub);padding:7px 14px;border-radius:50px;font-size:0.8em;font-weight:600;display:flex;align-items:center;gap:4px;}
        .summary-chip span{color:var(--pink);font-weight:700;}
        .scrollable-table{max-height:440px;overflow-y:auto;}
    </style>
</head>
<body>
<div class="container">

    <!-- 메인 -->
    <div id="mainPage" class="page active">
        <div class="main-header">
            <div class="main-logo">🌸</div>
            <h1 class="main-title">일본어 단어 암기</h1>
            <p class="main-subtitle">JLPT 레벨별 스마트 학습 시스템</p>
        </div>
        <div class="stat-bar" id="mainStatBar">
            <div class="stat-chip no-data">아직 시험 기록이 없습니다</div>
        </div>
        <div class="level-label">학습 레벨 선택</div>
        <div class="level-selector" id="levelSelector">
            <button class="level-btn active" onclick="selectLevel('N5')">N5</button>
            <button class="level-btn" onclick="selectLevel('N4')">N4</button>
            <button class="level-btn" onclick="selectLevel('N3')">N3</button>
            <button class="level-btn" onclick="selectLevel('N2')">N2</button>
            <button class="level-btn" onclick="selectLevel('N1')">N1</button>
        </div>
        <div class="main-buttons">
            <button class="main-btn btn-start"  onclick="startExam()">✏️ 시험 시작</button>
            <button class="main-btn btn-manage" onclick="showManage()">📚 단어 목록</button>
            <button class="main-btn btn-record" onclick="showRecord()">📊 시험 기록 조회</button>
        </div>
    </div>

    <!-- 시험 -->
    <div id="examPage" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="showMain()">← 메인</button>
            <span class="page-title">✏️ 단어 시험</span>
        </div>
        <div class="algo-info">📊 <strong>스마트 출제</strong> — 틀린 단어·미학습 단어를 우선 출제합니다.</div>
        <div class="progress-bar-container"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
        <div class="progress-text" id="progressText">1 / 20</div>
        <div class="word-card">
            <div class="word-japanese" id="examKanji"></div>
            <div class="word-hiragana" id="examHiragana"></div>
            <div class="word-korean"   id="examKorean"></div>
        </div>
        <div class="exam-buttons">
            <button class="show-meaning-btn" id="showMeaningBtn" onclick="showMeaning()">👁 뜻 보기</button>
            <div class="answer-buttons" id="answerButtons">
                <button class="correct-btn" onclick="answer(true)">⭕ 맞음</button>
                <button class="wrong-btn"   onclick="answer(false)">❌ 틀림</button>
            </div>
        </div>
    </div>

    <!-- 즉시 결과 -->
    <div id="resultPage" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="showMain()">← 메인</button>
            <span class="page-title">📋 시험 결과</span>
        </div>
        <div class="result-header">
            <span style="color:var(--gray);font-size:0.88em;font-weight:500;">시험 완료!</span>
            <span class="result-score" id="resultScore">0 / 20</span>
        </div>
        <div class="scrollable-table">
            <table class="result-table">
                <thead><tr><th>#</th><th>단어</th><th>히라가나</th><th>뜻</th><th>결과</th></tr></thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 단어 목록 (★ 개수 배지 완전 제거) -->
    <div id="managePage" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="showMain()">← 메인</button>
            <span class="page-title">📚 단어 목록</span>
        </div>
        <div class="manage-controls">
            <button class="add-word-btn" onclick="openAddModal()">+ 단어 추가</button>
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 검색..." oninput="onSearchInput()">
            <!-- ★ 개수 배지 완전 제거 -->

//  ★ 수정된 buildFilteredCache — 전체 words 배열 대상
//    슬라이스/제한 없이 완전히 동작
// ════════════════════════════════════════════════════════
function buildFilteredCache() {
    const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();

    // 1. 레벨 필터 (제한 없이 전체 words 배열 사용)
    let arr = (manageFilterLevel === 'ALL')
        ? words.slice()
        : words.filter(w => w.level === manageFilterLevel);

    // 2. 검색 필터
    if (search) {
        arr = arr.filter(w =>
            w.kanji.includes(search) ||
            w.hiragana.includes(search) ||
            w.korean.includes(search)
        );
    }

    // 3. 정렬
    if (sortMode !== 'none') {
        arr.sort((a, b) => {
            const ra = getRateValue(a.id), rb = getRateValue(b.id);
            if (ra === -1 && rb === -1) return 0;
            if (ra === -1) return 1;
            if (rb === -1) return -1;
            return sortMode === 'asc' ? ra - rb : rb - ra;
        });
    }
    return arr;
}

function updateMainStat() {
    const el = document.getElementById('mainStatBar');
    if (examHistory.length === 0) {
        el.innerHTML = `<div class="stat-chip no-data">아직 시험 기록이 없습니다</div>`;
        return;
    }
    const totalCorrect = examHistory.reduce((s, h) => s + h.correct, 0);
    const totalQ       = examHistory.reduce((s, h) => s + h.total, 0);
    const avgPct       = Math.round(totalCorrect / totalQ * 100);
    const best         = Math.max(...examHistory.map(h => h.pct));
    el.innerHTML = `
        <div class="stat-chip">📝 총 응시 <span class="stat-num">${examHistory.length}회</span></div>
        <div class="stat-chip">🎯 전체 정답률 <span class="stat-num">${avgPct}%</span></div>
        <div class="stat-chip">🏆 최고 점수 <span class="stat-num">${best}%</span></div>`;
}

// ════════════════════════════════════════════════════════
//  가중치 알고리즘
// ════════════════════════════════════════════════════════
function calcWeight(word) {
    const rec = records[word.id];
    let weight;
    if (!rec || rec.total === 0) weight = 10;
    else {
        const rate = rec.correct / rec.total;
        if      (rate === 0) weight = 12;
        else if (rate < 0.4) weight = 10;
        else if (rate < 0.6) weight = 6;
        else if (rate < 0.8) weight = 3;
        else                 weight = 1;
    }
    const idx = recentIds.indexOf(word.id);
    if (idx !== -1) weight *= Math.max(0.05, 1 - (recentIds.length - idx) / RECENT_WINDOW);
    return Math.max(weight, 0.05);
}
function weightedSample(pool, n) {
    const selected = [], remaining = [...pool];
    for (let i = 0; i < n && remaining.length > 0; i++) {
        const weights = remaining.map(w => calcWeight(w));
        const total   = weights.reduce((a, b) => a + b, 0);
        let rand = Math.random() * total, idx = 0;
        for (let j = 0; j < weights.length; j++) { rand -= weights[j]; if (rand <= 0) { idx = j; break; } }
        selected.push(remaining[idx]);
        remaining.splice(idx, 1);
    }
    return selected;
}

function startExam() {
    const pool = words.filter(w => w.level === selectedLevel);
    if (!pool.length) { alert('선택한 레벨에 단어가 없습니다.'); return; }
    examWords    = weightedSample(pool, Math.min(20, pool.length));
    currentIndex = 0;
    examResults  = [];
    showPage('examPage');
    renderExamWord();
}
function renderExamWord() {
    const word = examWords[currentIndex];
    document.getElementById('examKanji').textContent    = word.kanji;
    document.getElementById('examHiragana').textContent = word.hiragana;
    document.getElementById('examKorean').textContent   = word.korean;
    document.getElementById('examKorean').style.display = 'none';
    document.getElementById('showMeaningBtn').style.display = 'inline-block';
    document.getElementById('answerButtons').style.display  = 'none';
    document.getElementById('progressBar').style.width  = (currentIndex / examWords.length * 100) + '%';
    document.getElementById('progressText').textContent = (currentIndex + 1) + ' / ' + examWords.length;
}
function showMeaning() {
    document.getElementById('examKorean').style.display     = 'block';
    document.getElementById('showMeaningBtn').style.display = 'none';
    document.getElementById('answerButtons').style.display  = 'flex';
}
function answer(correct) {
    const word = examWords[currentIndex];
    examResults.push({ word, correct });
    if (!records[word.id]) records[word.id] = { correct: 0, total: 0 };
    records[word.id].total++;
    if (correct) records[word.id].correct++;
    recentIds = recentIds.filter(id => id !== word.id);
    recentIds.push(word.id);
    if (recentIds.length > RECENT_WINDOW) recentIds.shift();
    currentIndex++;
    if (currentIndex >= examWords.length) showResult();
    else renderExamWord();
}
function showResult() {
    const correctCount = examResults.filter(r => r.correct).length;
    const total = examResults.length;
    const pct   = Math.round(correctCount / total * 100);
    examHistory.unshift({ id: Date.now(), date: new Date(), level: selectedLevel, correct: correctCount, total, pct, results: examResults.map(r => ({ ...r })) });
    document.getElementById('resultScore').textContent = `${correctCount} / ${total}  (${pct}%)`;
    const tbody = document.getElementById('resultTableBody');
    tbody.innerHTML = '';
    examResults.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td>${r.word.kanji}</td><td>${r.word.hiragana}</td><td>${r.word.korean}</td><td class="${r.correct?'result-correct':'result-wrong'}">${r.correct?'⭕':'❌'}</td>`;
        tbody.appendChild(tr);
    });
    showPage('resultPage');
}

    document.querySelectorAll('#manageFilter .filter-btn').forEach(btn =>
        btn.classList.toggle('active',
            (level === 'ALL' && btn.textContent === '전체') || btn.textContent === level));
    initWordList();
}
function getRateValue(wordId) {
    const rec = records[wordId];
    if (!rec || rec.total === 0) return -1;
    return rec.correct / rec.total;
}
function getRateTag(wordId) {
    const rec = records[wordId];
    if (!rec || rec.total === 0) return `<span class="word-rate-tag rate-none">미응시</span>`;
    const rate = Math.round(rec.correct / rec.total * 100);
    const cls  = rate < 40 ? 'rate-low' : rate < 70 ? 'rate-mid' : 'rate-high';
    return `<span class="word-rate-tag ${cls}">${rate}%<small style="font-weight:400;margin-left:3px;">(${rec.correct}/${rec.total})</small></span>`;
}
function createWordRow(word) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><span class="word-level-tag">${word.level}</span></td>
        <td class="td-kanji">${word.kanji}</td>
        <td class="td-hira">${word.hiragana}</td>
        <td class="td-mean">${word.korean}</td>
        <td>${getRateTag(word.id)}</td>
        <td><button class="delete-btn" onclick="deleteWord(${word.id})">삭제</button></td>`;
    return tr;
}
function appendNextPage() {
    if (isLoading) return;
    const nextSlice = filteredCache.slice(loadedCount, loadedCount + PAGE_SIZE);
    if (!nextSlice.length) return;
    isLoading = true;
    const tbody = document.getElementById('wordTableBody');
    const loadingTr = document.createElement('tr');
    loadingTr.id = 'loadingRow';
    loadingTr.innerHTML = '<td colspan="6" style="text-align:center;padding:12px;color:#FFB3BC;font-size:0.82em;letter-spacing:2px;">⏳ 불러오는 중...</td>';
    tbody.appendChild(loadingTr);
    setTimeout(() => {
        const existing = document.getElementById('loadingRow');
        if (existing) existing.remove();
        nextSlice.forEach(word => tbody.appendChild(createWordRow(word)));
        loadedCount += nextSlice.length;
        updateScrollStatus();
        isLoading = false;
    }, 80);
}
function updateScrollStatus() {
    const el = document.getElementById('scrollStatus');
    const total = filteredCache.length;
    if (total === 0) { el.textContent = ''; return; }
    if (loadedCount >= total) {
        el.textContent = `전체 ${total.toLocaleString()}개 단어 표시 완료 ✓`;
    } else {
        el.textContent = `${loadedCount.toLocaleString()} / ${total.toLocaleString()}개 표시 중 — 스크롤하면 더 보기`;
    }
}
function setupScrollObserver() {
    if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
    const sentinel  = document.getElementById('scrollSentinel');
    const tableWrap = document.getElementById('wordTableWrap');
    scrollObserver = new IntersectionObserver(
        entries => {
            if (entries[0].isIntersecting && !isLoading && loadedCount < filteredCache.length) {
                appendNextPage();
            }
        },
        { root: tableWrap, threshold: 0.1 }
    );
    scrollObserver.observe(sentinel);
}
function initWordList() {
    if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
    filteredCache = buildFilteredCache(); // ★ 제한 없이 전체
    loadedCount   = 0;
    isLoading     = false;
    const tbody = document.getElementById('wordTableBody');
    tbody.innerHTML = '';
    if (filteredCache.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--gray);padding:30px;">단어가 없습니다.</td></tr>`;
        document.getElementById('scrollStatus').textContent = '';
        return;
    }
    // 첫 30개 즉시 렌더
    filteredCache.slice(0, PAGE_SIZE).forEach(word => tbody.appendChild(createWordRow(word)));
    loadedCount = Math.min(PAGE_SIZE, filteredCache.length);
    updateScrollStatus();
    requestAnimationFrame(() => setupScrollObserver());
}
function showManage() {
    manageFilterLevel = 'ALL';
    sortMode = 'none';
    updateSortBtn();
    document.querySelectorAll('#manageFilter .filter-btn').forEach(btn =>
        btn.classList.toggle('active', btn.textContent === '전체'));
    document.getElementById('searchInput').value = '';
    showPage('managePage');
    requestAnimationFrame(() => initWordList());
}
function deleteWord(id) {
    if (!confirm('이 단어를 삭제하시겠습니까?')) return;
    words     = words.filter(w => w.id !== id);
    delete records[id];
    recentIds = recentIds.filter(i => i !== id);
    initWordList();
}
function openAddModal() {
    ['inputKanji','inputHiragana','inputKorean'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('inputLevel').value = 'N5';
    document.getElementById('addModal').classList.add('active');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
function addWord() {
    const kanji    = document.getElementById('inputKanji').value.trim();
    const hiragana = document.getElementById('inputHiragana').value.trim();
    const korean   = document.getElementById('inputKorean').value.trim();
    const level    = document.getElementById('inputLevel').value;
    if (!kanji || !hiragana || !korean) { alert('모든 항목을 입력해주세요.'); return; }
    words.push({ id: nextId++, kanji, hiragana, korean, level });
    closeAddModal();
    initWordList();
}

// ════════════════════════════════════════════════════════
//  시험 기록
// ════════════════════════════════════════════════════════
function formatDate(date) {
    const d = new Date(date);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}  ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function getScoreClass(pct) { return pct >= 80 ? 'score-great' : pct >= 50 ? 'score-good' : 'score-poor'; }
function showRecord() { renderRecordList(); showPage('recordPage'); }
function renderRecordList() {
    const summaryEl = document.getElementById('recordSummary');
    if (examHistory.length > 0) {
        const totalC = examHistory.reduce((s,h)=>s+h.correct,0);
        const totalQ = examHistory.reduce((s,h)=>s+h.total,0);
        const avg    = Math.round(totalC/totalQ*100);
        const best   = Math.max(...examHistory.map(h=>h.pct));
        summaryEl.innerHTML = `
            <div class="summary-chip">📝 총 <span>${examHistory.length}회</span> 응시</div>
            <div class="summary-chip">🎯 전체 정답률 <span>${avg}%</span></div>
            <div class="summary-chip">🏆 최고 <span>${best}%</span></div>`;
    } else { summaryEl.innerHTML = ''; }
    const listEl = document.getElementById('recordList');
    if (!examHistory.length) {
        listEl.innerHTML = `<div class="no-record-msg">아직 시험 기록이 없습니다 📝<br><br>시험을 시작해보세요!</div>`;
        return;
    }
    listEl.innerHTML = '';
    examHistory.forEach((hist, idx) => {
        const div = document.createElement('div');
        div.className = 'record-item';
        div.onclick   = () => openDetailModal(idx);
        div.innerHTML = `
            <div class="record-item-left">
                <div class="record-item-date">🕐 ${formatDate(hist.date)}</div>
                <div class="record-item-info">
                    <span class="record-item-level">${hist.level}</span>
                    <span class="record-item-title">단어 시험 · ${hist.total}문제</span>
                </div>
            </div>
            <div class="record-item-right">
                <div class="record-score-badge ${getScoreClass(hist.pct)}">${hist.pct}%</div>
                <div class="record-score-detail">${hist.correct} / ${hist.total} 정답</div>
            </div>
            <span class="record-arrow">›</span>`;
        listEl.appendChild(div);
    });
}
function openDetailModal(histIdx) {
    const hist = examHistory[histIdx];
    document.getElementById('detailModalTitle').textContent = `${hist.level} 단어 시험 정오표`;
    document.getElementById('detailModalMeta').textContent  = `🕐 ${formatDate(hist.date)}`;
    document.getElementById('detailModalScore').textContent = `${hist.correct} / ${hist.total} 정답  (${hist.pct}%)`;
    const tbody = document.getElementById('detailTableBody');
    tbody.innerHTML = '';
    hist.results.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td>${r.word.kanji}</td><td>${r.word.hiragana}</td><td>${r.word.korean}</td><td class="${r.correct?'result-correct':'result-wrong'}">${r.correct?'⭕':'❌'}</td>`;
        tbody.appendChild(tr);
    });
    document.getElementById('detailModal').classList.add('active');
}
function closeDetailModal() { document.getElementById('detailModal').classList.remove('active'); }

// 모달 바깥 클릭 닫기
document.getElementById('addModal').addEventListener('click',    e => { if(e.target===document.getElementById('addModal'))    closeAddModal(); });
document.getElementById('detailModal').addEventListener('click', e => { if(e.target===document.getElementById('detailModal')) closeDetailModal(); });
</script>
